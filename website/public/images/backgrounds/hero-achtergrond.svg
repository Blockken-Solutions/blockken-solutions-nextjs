<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Zachte oranje en perzik achtergrond met glazen blokken" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="peachTop"><stop offset="0" stop-color="#faf1e5" stop-opacity=".9"/><stop offset=".7" stop-color="#faf1e5" stop-opacity="0"/></radialGradient>
    <radialGradient id="softLeft"><stop offset="0" stop-color="#ffedd5" stop-opacity=".8"/><stop offset=".7" stop-color="#ffedd5" stop-opacity="0"/></radialGradient>
    <radialGradient id="peachRight"><stop offset="0" stop-color="#ffe3c4" stop-opacity=".6"/><stop offset=".7" stop-color="#ffe3c4" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#f97316" stop-opacity=".14"/><stop offset=".7" stop-color="#f97316" stop-opacity="0"/></radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#faf1e5" stop-opacity="0"/><stop offset="1" stop-color="#faf1e5"/></linearGradient>
    <filter id="shadowLg" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#1c1917" flood-opacity=".08"/></filter>
    <filter id="shadowSm" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#1c1917" flood-opacity=".06"/></filter>
  </defs>

  <!-- basis -->
  <rect width="1440" height="720" fill="#f7f4ef"/>

  <!-- zachte gradiënten -->
  <circle cx="720" cy="164" r="340" fill="url(#peachTop)"/>
  <circle cx="96" cy="290" r="240" fill="url(#softLeft)"/>
  <circle cx="1296" cy="456" r="290" fill="url(#peachRight)"/>
  <circle cx="1204" cy="110" r="220" fill="url(#glow)"/>

  <!-- glazen blokken -->
  <rect x="1149" y="302" width="176" height="176" rx="32" fill="#fff" fill-opacity=".4" stroke="#fff" stroke-opacity=".6" filter="url(#shadowLg)"/>
  <rect x="86" y="434" width="128" height="128" rx="24" fill="#fff" fill-opacity=".3" stroke="#fff" stroke-opacity=".5" filter="url(#shadowSm)"/>
  <rect x="1094" y="115" width="72" height="72" rx="20" fill="#ffedd5" fill-opacity=".7" stroke="#f97316" stroke-opacity=".18" transform="rotate(10 1130 151)"/>
  <rect x="173" y="216" width="44" height="44" rx="14" fill="#fff" fill-opacity=".45" stroke="#e8e4dc" transform="rotate(-12 195 238)"/>

  <!-- overgang naar volgende sectie -->
  <rect y="580" width="1440" height="140" fill="url(#fade)"/>
</svg>
