<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Soft orange and peach background with flowing lines, glow and glass blocks" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- glows -->
    <radialGradient id="peachTop"><stop offset="0" stop-color="#faf1e5" stop-opacity=".9"/><stop offset=".7" stop-color="#faf1e5" stop-opacity="0"/></radialGradient>
    <radialGradient id="softLeft"><stop offset="0" stop-color="#ffedd5" stop-opacity=".85"/><stop offset=".7" stop-color="#ffedd5" stop-opacity="0"/></radialGradient>
    <radialGradient id="peachRight"><stop offset="0" stop-color="#ffe3c4" stop-opacity=".65"/><stop offset=".7" stop-color="#ffe3c4" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#f97316" stop-opacity=".16"/><stop offset=".7" stop-color="#f97316" stop-opacity="0"/></radialGradient>
    <radialGradient id="amber"><stop offset="0" stop-color="#fde68a" stop-opacity=".5"/><stop offset=".7" stop-color="#fde68a" stop-opacity="0"/></radialGradient>
    <radialGradient id="orange300"><stop offset="0" stop-color="#fdba74" stop-opacity=".38"/><stop offset=".7" stop-color="#fdba74" stop-opacity="0"/></radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#faf1e5" stop-opacity="0"/><stop offset="1" stop-color="#faf1e5"/></linearGradient>

    <!-- fluid line strokes (fade out at both ends) -->
    <linearGradient id="lineA" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f97316" stop-opacity="0"/><stop offset=".3" stop-color="#f97316" stop-opacity=".5"/><stop offset=".7" stop-color="#fdba74" stop-opacity=".55"/><stop offset="1" stop-color="#fdba74" stop-opacity="0"/></linearGradient>
    <linearGradient id="lineB" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fdba74" stop-opacity="0"/><stop offset=".35" stop-color="#fdba74" stop-opacity=".55"/><stop offset=".75" stop-color="#f97316" stop-opacity=".35"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></linearGradient>
    <linearGradient id="lineC" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fde68a" stop-opacity="0"/><stop offset=".5" stop-color="#fdba74" stop-opacity=".5"/><stop offset="1" stop-color="#fde68a" stop-opacity="0"/></linearGradient>

    <!-- blur for soft ribbons (userSpaceOnUse so thin shapes aren't clipped) -->
    <filter id="blur24" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1840" height="1120"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="shadowLg" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#1c1917" flood-opacity=".08"/></filter>
    <filter id="shadowSm" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#1c1917" flood-opacity=".06"/></filter>

    <!-- dot grids with soft edges -->
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="2" fill="#f97316"/></pattern>
    <radialGradient id="maskG"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="dotMask" maskContentUnits="objectBoundingBox"><rect width="1" height="1" fill="url(#maskG)"/></mask>
  </defs>

  <!-- base -->
  <rect width="1440" height="720" fill="#f7f4ef"/>

  <!-- background glows -->
  <circle cx="720" cy="164" r="340" fill="url(#peachTop)"/>
  <circle cx="96" cy="290" r="250" fill="url(#softLeft)"/>
  <circle cx="1296" cy="456" r="300" fill="url(#peachRight)"/>
  <circle cx="1204" cy="100" r="230" fill="url(#glow)"/>
  <circle cx="160" cy="660" r="260" fill="url(#amber)"/>
  <circle cx="1020" cy="720" r="280" fill="url(#orange300)"/>

  <!-- soft blurred ribbons (depth) -->
  <g filter="url(#blur24)" fill="none" stroke-linecap="round">
    <path d="M-60 600 C 240 500, 460 700, 760 610 S 1220 500, 1500 590" stroke="#fdba74" stroke-opacity=".22" stroke-width="64"/>
    <path d="M900 40 C 1120 150, 1280 -20, 1500 110" stroke="#f97316" stroke-opacity=".12" stroke-width="48"/>
  </g>

  <!-- fluid lines: bottom sweep -->
  <g fill="none" stroke-linecap="round">
    <path d="M-40 560 C 220 470, 420 640, 720 560 S 1200 460, 1480 540" stroke="url(#lineA)" stroke-width="2"/>
    <path d="M-40 590 C 240 505, 440 665, 740 590 S 1210 490, 1480 570" stroke="url(#lineB)" stroke-width="1.5"/>
    <path d="M-40 622 C 270 545, 470 700, 770 625 S 1230 525, 1480 605" stroke="url(#lineC)" stroke-width="2.5"/>
    <path d="M-40 655 C 300 585, 500 735, 800 660 S 1250 565, 1480 640" stroke="url(#lineA)" stroke-width="1" stroke-opacity=".7"/>
    <!-- top corners -->
    <path d="M-40 130 C 150 40, 300 210, 500 90" stroke="url(#lineB)" stroke-width="2"/>
    <path d="M-40 168 C 160 85, 310 245, 520 126" stroke="url(#lineC)" stroke-width="1.5"/>
    <path d="M940 40 C 1130 135, 1280 -10, 1480 90" stroke="url(#lineA)" stroke-width="2"/>
    <path d="M980 84 C 1150 185, 1300 52, 1480 150" stroke="url(#lineB)" stroke-width="1.5"/>
    <!-- side flows -->
    <path d="M-40 380 C 70 310, 170 450, 320 400" stroke="url(#lineA)" stroke-width="1.5" stroke-opacity=".8"/>
    <path d="M1120 330 C 1250 260, 1330 400, 1480 330" stroke="url(#lineC)" stroke-width="2"/>
  </g>

  <!-- dot grids -->
  <rect x="1240" y="610" width="170" height="86" fill="url(#dots)" opacity=".5" mask="url(#dotMask)"/>
  <rect x="20" y="30" width="170" height="86" fill="url(#dots)" opacity=".45" mask="url(#dotMask)"/>

  <!-- glass blocks (left) -->
  <rect x="86" y="434" width="128" height="128" rx="24" fill="#fff" fill-opacity=".32" stroke="#fff" stroke-opacity=".55" filter="url(#shadowSm)"/>
  <rect x="173" y="216" width="44" height="44" rx="14" fill="#fff" fill-opacity=".45" stroke="#e8e4dc" transform="rotate(-12 195 238)"/>
  <rect x="40" y="150" width="150" height="52" rx="26" fill="#ffedd5" fill-opacity=".75" stroke="#f97316" stroke-opacity=".2" transform="rotate(-14 115 176)"/>
  <rect x="236" y="318" width="36" height="36" rx="11" fill="#f97316" fill-opacity=".92" transform="rotate(12 254 336)"/>
  <rect x="96" y="596" width="64" height="64" rx="18" fill="#fde68a" fill-opacity=".85" transform="rotate(8 128 628)"/>
  <circle cx="290" cy="130" r="22" fill="none" stroke="#f97316" stroke-opacity=".35" stroke-width="2"/>
  <rect x="300" y="500" width="26" height="26" rx="8" fill="#fff" fill-opacity=".5" stroke="#e8e4dc" transform="rotate(18 313 513)"/>

  <!-- glass blocks (right) -->
  <rect x="1149" y="302" width="176" height="176" rx="32" fill="#fff" fill-opacity=".4" stroke="#fff" stroke-opacity=".6" filter="url(#shadowLg)"/>
  <rect x="1094" y="115" width="72" height="72" rx="20" fill="#ffedd5" fill-opacity=".72" stroke="#f97316" stroke-opacity=".18" transform="rotate(10 1130 151)"/>
  <rect x="1262" y="196" width="140" height="48" rx="24" fill="#fff" fill-opacity=".5" stroke="#e8e4dc" transform="rotate(-9 1332 220)"/>
  <circle cx="1346" cy="92" r="30" fill="none" stroke="#f97316" stroke-opacity=".3" stroke-width="2"/>
  <circle cx="1346" cy="92" r="8" fill="#f97316" fill-opacity=".85"/>
  <rect x="1290" y="540" width="56" height="56" rx="16" fill="#fde68a" fill-opacity=".85" transform="rotate(-10 1318 568)"/>
  <rect x="1088" y="480" width="22" height="22" rx="7" fill="#f97316" fill-opacity=".85" transform="rotate(-14 1099 491)"/>
  <rect x="1190" y="508" width="96" height="36" rx="18" fill="#ffedd5" fill-opacity=".7" stroke="#f97316" stroke-opacity=".18" transform="rotate(8 1238 526)"/>

  <!-- small plus marks -->
  <g stroke="#f97316" stroke-opacity=".45" stroke-width="2" stroke-linecap="round">
    <path d="M338 238v14M331 245h14"/>
    <path d="M1120 262v14M1113 269h14"/>
    <path d="M230 700v12M224 706h12"/>
    <path d="M1380 410v12M1374 416h12"/>
  </g>

  <!-- fade into next section -->
  <rect y="580" width="1440" height="140" fill="url(#fade)"/>
</svg>
